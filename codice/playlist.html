<!doctype html>
<html lang="en">
    <head>
        <title>MusicApp</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <link rel="stylesheet" href="style.css">
    </head>

    <body onload="onload()" class="bg-dark">
        <header>
            <nav
                class="container-fluid navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-3" style="border-color: peachpuff;"
            >
                <div class="container">
                    <img
                        src="img\musicapp.jpg"
                        class="img-fluid rounded-4"
                        alt="MusicApp"
                        id="logonavbar"
                    />
                    <button
                        class="navbar-toggler d-lg-none"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapsibleNavId"
                        aria-controls="collapsibleNavId"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    ></button>
                    <div class="collapse navbar-collapse" id="collapsibleNavId">
                        <ul class="navbar-nav me-auto mt-2 mt-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" href="homepage.html" aria-current="page"
                                    >MusicApp! <span class="visually-hidden">(current)</span></a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Libreria personale</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Lista amici</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Modifica profilo</a>
                            </li>
                        </ul>
                        <form class="d-flex my-2 my-lg-0">
                            <input
                                class="form-control me-sm-2"
                                type="text"
                                placeholder="Cerca una canzone, artista o album..."
                            />
                            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">
                                Cerca
                            </button>
                        </form>
                        <ul class="navbar-nav me-auto mt-2 mt-lg-0">
        
                            <li class="nav-item">
                                <button class="btn btn-outline-success my-2 my-sm-0" type="submit">
                                    Logout
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <br>

        <main>
            <h1 id="prova"></h1>
            <div class="row">
                <div class="col-1"></div>
                <div class="col-10">
                    <div class="row">
                        <div class="col-3">
                            <img id="imgPlay" src="img\musicapp.jpg" alt="ciao">
                        </div>
                        <div class="col-7 d-flex flex-column">
                            <div class="row" id="titoloPlaylist">
                                <div class="col-12">
                                    <p class="h2" id="titolo">Titolo Playlist</h2>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12">
                                    <p id="descrizione">Descrizione Playlist</p>
                                </div>
                            </div>
                            <div class="row mt-auto">
                                <div class="col-12">
                                    <p id="autore"><u> Playlist </u></p>
                                </div>
                            </div>
                        </div>
                        <div class="col-2 d-flex flex-column">
                            
                            <div class="row mt-auto">
                                <div class="col-12"> 
                                    <button type="button" class="button" id="btnAddSong">
                                        <span class="button__text">Add Song</span>
                                        <span class="button__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg"><line y2="19" y1="5" x2="12" x1="12"></line><line y2="12" y1="12" x2="19" x1="5"></line></svg></span>
                                      </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">   
                            <hr id="rowpeachpuff" class="border border-2 opacity-75">
                        </div>
                    </div>
                    
                    
                    <div class="row">
                        <div class="col-12">
                            <table class="table table-dark">
                                <thead>
                                    <tr>
                                        <th scope="col">Titolo</th>
                                        <th scope="col">Autori</th>
                                        <th scope="col">Generi</th>
                                        <th scope="col">Durata</th>
                                    </tr>
                                </thead>
                                <tbody id="tabCanzoni">
                                    
                                    <!-- Add more rows as needed -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-1"></div>
            </div>
            
        </main>

        <br>
        <br>
        <footer>
            <div class="container-fluid bg-dark text-white py-2 foot border-top border-3">
                <div class="row text-center justify-content-center align-items-center">
                    <div class="col-10">
                        <p>Sito creato per MusicApp sotto licenza creativa BY-SA 4.0<br><a href="https://www.youtube.com/watch?v=8ybW48rKBME">Clicca qui per ricevere maggiori informazioni</a></p>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>

        <script src="func/playlist.js"></script>
    </body>
</html>
